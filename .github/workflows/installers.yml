# Makes the desktop app's installers (docs/desktop.md) on every push to
# main, and when run by hand from the Actions tab: a .dmg for macOS (one
# app for Apple Silicon and Intel Macs) and an .msi and a setup .exe for
# Windows. They're kept for 30 days as the run's artifacts, to download
# and try. They're signed once the repository holds the signing settings
# (docs/desktop.md, "Signing"): Azure Artifact Signing for Windows, a
# Developer ID with notarization for macOS. Until then they're unsigned, and
# each system asks once before opening them.

name: Desktop installers

on:
  push:
    branches: [main]
  # A change to this workflow is tried on its pull request.
  pull_request:
    paths:
      - ".github/workflows/installers.yml"
  workflow_dispatch:

# A newer push cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installers:
    name: Installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            bundles: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            bundles: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # The support links the site shows, from the repository's variables
      # (Settings → Secrets and variables → Actions → Variables), if set.
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_DISCORD_URL: ${{ vars.NEXT_PUBLIC_DISCORD_URL }}
      NEXT_PUBLIC_PATREON_URL: ${{ vars.NEXT_PUBLIC_PATREON_URL }}
      NEXT_PUBLIC_KOFI_URL: ${{ vars.NEXT_PUBLIC_KOFI_URL }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Rust for both kinds of Mac
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Signs Windows's installers and the app in them through Azure
      # Artifact Signing, once its account is set up.
      - name: Signing tool for Windows
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ACCOUNT != ''
        run: cargo install artifact-signing-cli --locked
      # Builds the site (out/) first, then the app around it and its
      # installers, signed when this platform's settings are all set
      # (scripts/signing.mjs); unset ones arrive empty and are ignored.
      - id: build
        run: npm run desktop:build -- ${{ matrix.args }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      # A signed build is checked as each system will: a signature that
      # isn't valid fails the run rather than reaching anyone.
      - name: Check the Windows signatures
        if: runner.os == 'Windows' && steps.build.outputs.signed == 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle/msi/*.msi, target/release/bundle/nsis/*.exe, target/release/dawn-desktop.exe
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Output "$($f.Name): $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) isn't signed properly: $($sig.StatusMessage)" }
          }
      - name: Check the Mac signature and notarization
        if: runner.os == 'macOS' && steps.build.outputs.signed == 'true'
        run: |
          app=$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - uses: actions/upload-artifact@v7
        with:
          name: Dawn-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 30
