[package]
name = "dawn-plugins"
version = "0.1.0"
description = "Hosting VST3 and CLAP plugins in Dawn's desktop app: finding them, and running them in the native engine."
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# CLAP (MIT): loading a plugin's entry and reading its factory.
clack-host = "0.2"
# CLAP's extensions a host uses: a plugin's state, latency, audio ports,
# note ports (how an instrument takes its notes) and window (put in one of
# the app's, by its raw window handle).
clack-extensions = { version = "0.2", features = ["clack-host", "state", "latency", "audio-ports", "note-ports", "gui", "raw-window-handle_06"] }
# The library a VST3 module is loaded with on Windows and Linux.
libloading = "0.9"
# Edits made in a VST3 plugin's window, on their way to its processor.
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# VST3 (the SDK's interfaces, MIT since 3.8; these bindings MIT or Apache-2.0).
vst3 = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Keeping the scan's process out of the Dock.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
# A VST3 bundle on macOS is loaded through CFBundle.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBundle", "CFURL", "CFString"] }

